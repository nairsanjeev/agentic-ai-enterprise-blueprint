name: Task
description: A concrete, actionable task within an epic (spec, infra, pipeline, or agent work)
title: "[Area]: "
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - spec
        - infra
        - pipeline
        - agent
        - docs
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - network
        - foundry
        - apim
        - governance
        - agent
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of what "done" looks like
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends on (issue #)
      placeholder: "#1"
